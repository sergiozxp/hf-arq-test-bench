# Copy this file to smoke_config.toml on each PC and edit the callsigns.
[general]
results_dir = "results"
payload_seed = 20261021
max_payload_bytes = 1048576
protocol_version = "5.0"
smoke_profile = "MS-1.0"
app_version = "0.2.0-alpha.2"

[mercury]
host = "127.0.0.1"
cmd_port = 8300
data_port = 8301
mycall = "CALL-A"
peer_call = "CALL-B"
bw_command = "BW500"
cmd_response_window_s = 2.0
connect_timeout_s = 180
listen_timeout_s = 900
transfer_timeout_s = 1800
idle_timeout_s = 60
extra_bytes_grace_s = 5
disconnect_wait_s = 60
session_tolerance_ms = 50
error_patterns = []

[binaries]
mercury_zip = ""
mercury_exe = ""

[evidence]
mercury_ini = ""
mercury_log = ""
mercury_console = ""

# Written by the GUI when it starts Mercury. Run by hand: Mercury was started outside the GUI.
[mercury_session]
launched_by_gui = false
