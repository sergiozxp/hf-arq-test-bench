# Copy this file to smoke_config.toml on each PC when running the scripts by hand.
# The GUI writes it for you. Each PC has its own callsign; use numeric SSIDs (-1, -2):
# VARA treats -T, -R, -X and -L as special extensions.
[general]
results_dir = "results"
payload_seed = 20261021
max_payload_bytes = 1048576
protocol_version = "5.2"
smoke_profile = "MS-1.0"
app_version = "0.2.0-alpha.3"

[modem]
name = "mercury"            # "mercury" or "vara"
arm = "Mercury 1.9.19"      # or "VARA HF unlicensed" / "VARA HF licensed"

[tnc]
host = "127.0.0.1"
cmd_port = 8300
data_port = 8301
mycall = "XQ2CG-1"          # PC A: XQ2CG-1 / PC B: XQ2CG-2
peer_call = "XQ2CG-2"
bw_command = "BW500"
cmd_response_window_s = 2.0
connect_timeout_s = 180
listen_timeout_s = 900
transfer_timeout_s = 1800
idle_timeout_s = 60
extra_bytes_grace_s = 5
disconnect_wait_s = 60
ack_timeout_s = 600         # E0-3: time for B's ACK to come back in the same session
session_tolerance_ms = 50
error_patterns = []

[binaries]
mercury_zip = ""
mercury_exe = ""
vara_exe = ""               # for example 'C:\VARA\VARA.exe' (single quotes keep backslashes)

[evidence]
mercury_ini = ""
mercury_log = ""
mercury_console = ""
vara_ini = ""               # archived with registration codes and password removed

# Written by the GUI when it starts Mercury. Run by hand: Mercury was started outside the GUI.
[mercury_session]
launched_by_gui = false

[vara_session]
