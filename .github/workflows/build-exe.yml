name: Build HF-ARQ Modem Smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (for example v0.2.0-alpha.3). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run simulated smoke tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tests/test_logic.py
          python tests/test_runtime.py
          python tests/test_cross_check.py
          python tests/test_status.py
          python tests/test_vara.py
          python tests/test_simulated_gui.py
          python tests/test_receiver_rules.py
          python tests/test_launcher.py --launcher "python smoke/smoke_gui.py"
      - name: Download the official Mercury 1.9.19 Windows ZIP
        shell: pwsh
        run: >-
          Invoke-WebRequest
          -Uri https://github.com/Rhizomatica/mercury/releases/download/v1.9.19/mercury-1.9.19-w64-e9f0072d.zip
          -OutFile "$env:RUNNER_TEMP/mercury-1.9.19-w64-e9f0072d.zip"
      - name: Run tests against the real Mercury 1.9.19 (no sound card)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tests/test_real_mercury.py --zip "$env:RUNNER_TEMP/mercury-1.9.19-w64-e9f0072d.zip"
          python tests/test_gui_real_mercury.py --zip "$env:RUNNER_TEMP/mercury-1.9.19-w64-e9f0072d.zip"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packager
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build the smoke executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name HF-ARQ-Modem-Smoke --paths smoke smoke/smoke_gui.py
      - name: Write release checksums
        shell: pwsh
        run: |
          Get-FileHash dist/HF-ARQ-Modem-Smoke.exe -Algorithm SHA256 |
            Format-List | Out-File -Encoding utf8 dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HF-ARQ-Modem-Smoke
          path: |
            dist/HF-ARQ-Modem-Smoke.exe
            dist/SHA256SUMS.txt

  release:
    # A pushed tag, or "Run workflow" on main with a release tag.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the application version
        run: |
          set -eu
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "Bad tag: $TAG"; exit 1; }
          version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' smoke/smoke_gui_logic.py)
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG does not match APP_VERSION $version"; exit 1; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"; exit 1
          fi
          case "$TAG" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV";; *) echo "PRERELEASE=false" >> "$GITHUB_ENV";; esac
      - uses: actions/download-artifact@v4
        with:
          name: HF-ARQ-Modem-Smoke
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: ${{ env.PRERELEASE }}
          generate_release_notes: true
          files: |
            release/HF-ARQ-Modem-Smoke.exe
            release/SHA256SUMS.txt
