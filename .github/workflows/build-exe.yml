name: Build HF-ARQ Modem Smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run simulated smoke tests
        shell: pwsh
        run: |
          python tests/test_logic.py
          python tests/test_simulated_gui.py
          python tests/test_launcher.py --launcher "python smoke/smoke_gui.py"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packager
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build the smoke executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name HF-ARQ-Modem-Smoke --paths smoke smoke/smoke_gui.py
      - name: Write release checksums
        shell: pwsh
        run: |
          Get-FileHash dist/HF-ARQ-Modem-Smoke.exe -Algorithm SHA256 |
            Format-List | Out-File -Encoding utf8 dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HF-ARQ-Modem-Smoke
          path: |
            dist/HF-ARQ-Modem-Smoke.exe
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HF-ARQ-Modem-Smoke
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/HF-ARQ-Modem-Smoke.exe
            release/SHA256SUMS.txt
